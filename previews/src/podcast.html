<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>

.desk{position:absolute;left:0;right:0;top:1300px;height:620px;background:#2a1e18;border-top:14px solid #5a4030}
.plate{position:absolute;top:1340px;padding:14px 30px;border-radius:12px;background:#111;color:#fff;font:800 34px Inter;letter-spacing:3px}
.cap{color:#fff;font-size:66px;bottom:300px}
